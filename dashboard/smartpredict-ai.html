<script>
const API=(()=>{try{return localStorage.getItem('sp_api')}catch(e){}})()||'http://localhost:5000/api',$=s=>document.querySelector(s),clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const K=8333,N=K*12,STEP=9e5,T0=Date.now()-K*STEP,CFG={tT:85,hT:75,r:[30,60,80]};
const BASE=[[66,50],[84,70],[92,80],[64,48],[72,74],[70,55],[78,58],[68,52],[88,66],[62,46],[74,62],[81,72]];
const R=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
function rd(i){const m=i%12,k=(i-m)/12,sp=R(i+7)>.985,ph=k/96*6.283,[bt,bh]=BASE[m];return{i,m,id:'M'+String(m+1).padStart(3,'0'),ts:T0+k*STEP,t:+(bt+6*Math.sin(ph)+(R(i)-.5)*6+(sp?14:0)).toFixed(1),h:+(bh+8*Math.sin(ph+1)+(R(i+3)-.5)*8+(sp?10:0)).toFixed(1)}}

const cls=(t,h)=>(t>=90||h>=85||(t>=CFG.tT&&h>=CFG.hT))?'Critical':(t>=80||h>=70)?'Warning':'Normal';
const rk=p=>{const v=p*100;return v<=CFG.r[0]?'Low':v<=CFG.r[1]?'Medium':v<=CFG.r[2]?'High':'Critical'};
const rulc=d=>d==null?'N/A':d>30?'Good':d>14?'Moderate':d>7?'Low':'Critical';
function en(r){r.p=fp(r.t,r.h);r.st=cls(r.t,r.h);const a=r.t>CFG.tT,b=r.h>CFG.hT;r.an=a||b||r.st==='Critical';r.ty=a&&b?'Combined':a?'Temperature':b?'Humidity':r.st==='Critical'?'Combined':'None';r.rk=rk(r.p);r.mt=r.st!=='Normal'||r.p>.3;r.rul=r.m>=9?null:Math.max(1,Math.round((1-r.p)*45));r.sev=!r.an?'Normal':r.p>=.8?'Critical':r.p>=.6?'High':r.p>=.4?'Medium':'Low';return r}
const rec=i=>en(rd(i)),mach=k=>[...Array(12).keys()].map(m=>{const a=LV.rows[m];if(k===K-1&&a&&a.length){const l=a[a.length-1],r=en({...l});r.live=true;if(Date.now()-l.ts>12e4){r.st='No signal';r.an=false;r.mt=false;r.ty='None';r.p=0;r.rk='Low';r.sev='Normal'}return r}return rec(k*12+m)});
const fmt=ts=>new Date(ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const S=(()=>{const s={an:0,ta:0,ha:0,ca:0,t:0,h:0,pm:Array(12).fill(0)};for(let i=0;i<N;i++){const r=rd(i);s.t+=r.t;s.h+=r.h;const a=r.t>CFG.tT,b=r.h>CFG.hT;if(a||b||cls(r.t,r.h)==='Critical'){s.an++;s.pm[r.m]++;if(a&&!b)s.ta++;else if(b&&!a)s.ha++;else s.ca++}}return s})();

const tb=(cols,rows)=>`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs uppercase text-slate-500 border-b border-slate-200 dark:border-slate-700"><tr>${cols.map(c=>`<th class="px-3 py-2 text-left font-medium whitespace-nowrap">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-b border-slate-100 dark:border-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/30">${r.map(c=>`<td class="px-3 py-2 whitespace-nowrap">${c}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="p-6 text-center text-slate-500">No data matches the filters</td></tr>`}</tbody></table></div>`;
const kpi=(i,l,v,d,t)=>`<div class="${card} hover:shadow-md transition"><div class="flex justify-between text-2xl">${i}<span class="text-xs ${t>0?'text-red-500':'text-emerald-500'}">${t==null?'':(t>0?'▲ ':t<0?'▼ ':'– ')+Math.abs(t)+' vs 24h'}</span></div><div class="text-3xl font-bold mt-1">${v}</div><div class="text-sm font-medium">${l}</div><div class="text-xs text-slate-500">${d}</div></div>`;
const gauge=(v,c)=>`<div class="grid place-items-center rounded-full" style="width:120px;height:120px;background:conic-gradient(${c} ${v*3.6}deg,#64748b33 0)"><div class="w-24 h-24 rounded-full bg-white dark:bg-slate-800 grid place-items-center font-bold text-xl">${v}%</div></div>`;
const gc=v=>v>=80?'#ef4444':v>=60?'#f97316':v>=30?'#f59e0b':'#10b981';
const sec=(t,b,x='')=>`<section class="${card} ${x}"><h3 class="font-semibold mb-3">${t}</h3>${b}</section>`;
const cv=(id,h=260)=>`<div style="height:${h}px"><canvas id="${id}"></canvas></div>`;
const hd=(t,s)=>`<h1 class="text-2xl font-bold">${t}</h1><p class="text-sm text-slate-500 mb-4">${s||''}</p>`;
const CH={};function ch(id,type,data,opt={}){CH[id]&&CH[id].destroy();const c=document.getElementById(id);if(!c)return;CH[id]=new Chart(c,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:data.datasets.length>1}}},opt)})}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)}
function pts(mid,hrs){if(mid!=='all'&&LV.rows[+mid]&&LV.rows[+mid].length>1)return LV.rows[+mid].slice(-120).map(x=>en({...x}));const n=hrs*4,s=Math.max(1,Math.round(n/60)),o=[];for(let k=K-n;k<K;k+=s)o.push(mid==='all'?(rs=>({ts:rs[0].ts,t:Math.max(...rs.map(r=>r.t)),h:Math.max(...rs.map(r=>r.h)),p:Math.max(...rs.map(r=>r.p))}))(mach(k)):rec(k*12+ +mid));return o}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=x=>x.toFixed(1);
const lab=d=>d.map(r=>r.i===-1?new Date(r.ts).toLocaleTimeString():fmt(r.ts));
/* ---------- live sensor mode ---------- */
const LV={ok:false,rows:{},since:null,st:''};
const AN={
    total:0,
    healthy:0,
    warning:0,
    critical:0,
    anomalies:0,
    maintenance:0,
    sensors:[]
};
function liveRec(x){const m=parseInt(String(x.machine_id).slice(1))-1;if(!(m>=0&&m<12))return null;return{m,id:'M'+String(m+1).padStart(3,'0'),i:-1,ts:new Date(x.ts||Date.now()).getTime(),t:+x.temperature,h:+x.humidity}}
const lvAge=()=>{let t=0;Object.values(LV.rows).forEach(a=>t=Math.max(t,a[a.length-1].ts));return t};
function lvb(){const t=lvAge(),s=!LV.ok?'demo':(!t||Date.now()-t>12e4)?'nosig':'live',M={demo:['DEMO DATA · backend not connected','bg-amber-100 text-amber-800'],nosig:['NO SIGNAL · backend up, sensor silent','bg-red-100 text-red-700'],live:['● LIVE · last reading '+new Date(t).toLocaleTimeString(),'bg-emerald-100 text-emerald-700']}[s],e=$('#lvb');if(e){e.className='ml-auto text-xs px-2 py-1 rounded cursor-pointer '+M[1];e.textContent=M[0]}return s}
async function poll(){

    let fresh = 0;

    try {

        const r = await axios.get(
            API + '/readings' +
            (LV.since
                ? '?since=' + encodeURIComponent(LV.since)
                : ''),
            {
                timeout:3000
            }
        );

        LV.ok = true;

        (Array.isArray(r.data) ? r.data : [])
            .slice()
            .reverse()
            .forEach(x => {

                const v = liveRec(x);

                if (
                    !v ||
                    isNaN(v.t) ||
                    isNaN(v.h)
                ) return;

                const a =
                    LV.rows[v.m] =
                    LV.rows[v.m] || [];

                if (
                    a.length &&
                    a[a.length - 1].ts >= v.ts
                ) return;

                a.push(v);

                if (a.length > 300)
                    a.shift();

                LV.since =
                    new Date(v.ts).toISOString();

                fresh++;
            });

    } catch(e) {

        LV.ok = false;
    }


    // ============================================
    // SEND CURRENT 3 SENSOR READINGS TO PYTHON
    // ============================================

    const readings = Object.values(LV.rows)
        .map(arr => arr[arr.length - 1])
        .filter(Boolean)
        .map(r => ({
            machine_id: r.id,
            temperature: r.t,
            humidity: r.h
        }));


    if (readings.length > 0) {

        try {

            const result = await axios.post(
                'http://localhost:8000/analyze',
                {
                    readings: readings
                },
                {
                    timeout:3000
                }
            );


            Object.assign(
                AN,
                result.data
            );

        } catch(e) {

            console.log(
                'Python analysis API error:',
                e.message
            );

        }

    }


    const s = lvb();

    if (
        fresh ||
        s !== LV.st
    ) {

        LV.st = s;

        refresh();

    }
}
function refresh(){const p=location.hash.slice(2).split('/'),pg=p[0]||'dashboard';if(pg==='dashboard'||(pg==='machine'&&p[1]&&LV.rows[+p[1].slice(1)-1]))go(true);else if(pg==='machines')drawMT()}
function setApi(){const v=prompt('Backend API base URL',API);if(v){try{localStorage.setItem('sp_api',v)}catch(e){}location.reload()}}
function lvCard(){

    const ks = Object.keys(LV.rows);

    if (!LV.ok || !ks.length) {

        return sec(
            'Live Sensor Readings',

            `<p class="text-sm text-slate-500">
                ${LV.ok
                    ? 'Backend connected. Waiting for sensor readings...'
                    : 'Not connected. Start backend and bridge.'
                }
            </p>

            <button
                class="${btn} mt-2"
                onclick="setApi()">
                Change API URL
            </button>`
        );
    }


    const cards = ks
        .sort((a,b) => Number(a) - Number(b))
        .map(k => {

            const arr = LV.rows[k];

            const l =
                arr[arr.length - 1];


            return `

            <div class="${card}">

                <div class="text-lg font-semibold mb-3">
                    Sensor ${l.m + 1}
                    <span class="text-sm text-slate-500">
                        (${l.id})
                    </span>
                </div>

                <div class="text-3xl font-bold">

                    ${l.t.toFixed(1)}°C

                    <span class="text-blue-500">
                        ${l.h.toFixed(1)}%
                    </span>

                </div>

                <div class="grid grid-cols-2 gap-3 mt-4">

                    <div>
                        <div class="text-xs text-slate-500">
                            Temperature
                        </div>

                        <div class="font-semibold">
                            ${l.t.toFixed(1)} °C
                        </div>
                    </div>

                    <div>
                        <div class="text-xs text-slate-500">
                            Humidity
                        </div>

                        <div class="font-semibold text-blue-500">
                            ${l.h.toFixed(1)} %
                        </div>
                    </div>

                </div>

                <div class="text-xs text-slate-500 mt-3">

                    Last reading:
                    ${new Date(l.ts).toLocaleTimeString()}

                </div>

            </div>

            `;

        })
        .join('');


    return sec(
        'Live Sensor Readings',

        `<div class="grid md:grid-cols-3 gap-3">
            ${cards}
        </div>`,

        'mb-3'

}
function lvDraw(){const ks=Object.keys(LV.rows);if(!ks.length)return;const a=LV.rows[ks[0]].slice(-60);ch('lv','line',{labels:a.map(x=>new Date(x.ts).toLocaleTimeString()),datasets:[{label:'Temp °C',data:a.map(x=>x.t),borderColor:'#14b8a6',pointRadius:0},{label:'Humidity %',data:a.map(x=>x.h),borderColor:'#3b82f6',pointRadius:0}]},{plugins:{legend:{display:true}},scales:{x:{ticks:{maxTicksLimit:5}}}})}
/* ---------- pages ---------- */
let F={m:'all',hr:24,ab:'all'},AL=false;
const alerts=M=>M.flatMap(r=>{const a=[];if(r.t>CFG.tT)a.push([r,'High temperature detected','High']);if(r.h>CFG.hT)a.push([r,'High humidity detected','Medium']);if(r.t>CFG.tT&&r.h>CFG.hT)a.push([r,'Abnormal temperature-humidity combination','Critical']);if(r.p>.6)a.push([r,'High failure probability ('+Math.round(r.p*100)+'%)','High']);if(r.rk==='High'||r.rk==='Critical')a.push([r,'High downtime risk','High']);if(r.mt)a.push([r,'Maintenance required','Medium']);return a}).sort((a,b)=>['Critical','High','Medium'].indexOf(a[2])-['Critical','High','Medium'].indexOf(b[2]));
const alertList=M=>{const a=alerts(M);return `<ul class="space-y-2 text-sm">${(AL?a:a.slice(0,6)).map(([r,m,s])=>`<li class="flex gap-2 items-center">${bd(s)}<b>${r.id}</b><span class="flex-1">${m}</span><span class="text-xs text-slate-500">${fmt(r.ts)}</span></li>`).join('')||'<li class="text-slate-500">No active alerts</li>'}</ul><button class="${btn} mt-3" onclick="AL=!AL;go()">${AL?'Show fewer':'View All Alerts ('+a.length+')'}</button>`};
const hdrs={dashboard:'Dashboard'};
const P={
dashboard(){const M=mach(K-1),O=mach(K-97),c=(a,f)=>a.filter(f).length,fl=[...Array(48).keys()].map(j=>mach(K-192+j*4));
return{h:hd('Dashboard','Temperature + Humidity → Processing → ML Prediction → Anomaly Detection → Risk → Maintenance')+lvCard()+`<div class="grid grid-cols-2 lg:grid-cols-3 gap-3">
    ${kpi(
    '🏭',

${kpi(

${kpi(

${kpi(

${kpi(

<div class="grid lg:grid-cols-3 gap-3 mt-3">${sec('Fleet average temperature & humidity (last 48h)',cv('c1'),'lg:col-span-2')}${sec('Machine status',cv('c2'))}</div>
<div class="grid lg:grid-cols-2 gap-3 mt-3">${sec('Alerts & Notifications',alertList(M))}${sec('Workflow','<ol class="text-sm space-y-1.5 list-decimal pl-5"><li>Data loading (historical dataset)</li><li>Temperature &amp; humidity monitoring</li><li>Data analysis</li><li>Anomaly detection</li><li>Machine health assessment</li><li>Failure / downtime prediction</li><li>Remaining useful life (if model supports it)</li><li>Maintenance recommendation</li></ol>')}</div>`,
d(){lvDraw();const l=fl.map(a=>fmt(a[0].ts));ch('c1','line',{labels:l,datasets:[{label:'Avg Temp °C',data:fl.map(a=>avg(a.map(r=>r.t))),borderColor:'#14b8a6',pointRadius:0,tension:.3},{label:'Avg Humidity %',data:fl.map(a=>avg(a.map(r=>r.h))),borderColor:'#3b82f6',pointRadius:0,tension:.3}]},{plugins:{legend:{display:true}},scales:{x:{ticks:{maxTicksLimit:6}}}});
ch('c2','doughnut',{labels:['Normal','Warning','Critical'],datasets:[{data:['Normal','Warning','Critical'].map(s=>c(M,r=>r.st===s)),backgroundColor:['#10b981','#f59e0b','#ef4444']}]},{plugins:{legend:{display:true,position:'bottom'}}})}}},
machines(){return{h:hd('Machine Monitoring','Live status of every machine (latest reading)')+sec('Machines',`<div class="flex flex-wrap gap-2 mb-3"><input id="q" class="${inp}" placeholder="Search machine ID…" oninput="MS.q=this.value;MS.pg=0;drawMT()"><select class="${inp}" onchange="MS.st=this.value;MS.pg=0;drawMT()"><option value="">All statuses</option><option>Normal</option><option>Warning</option><option>Critical</option></select><select class="${inp}" onchange="MS.rk=this.value;MS.pg=0;drawMT()"><option value="">All risks</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div><div id="mt"></div>`),d:drawMT}},

return{h:`<a href="#/machines" class="text-sm text-teal-600">← All machines</a>`+hd('Machine '+r.id,'Last updated '+fmt(r.ts))+`<div class="grid lg:grid-cols-4 gap-3"><div class="${card} flex flex-col items-center"><div class="text-sm mb-2">Machine Health Score</div>${gauge(hs,gc(100-hs))}<div class="mt-2 text-sm">${hs} / 100 — ${hs>=70?'Good':hs>=40?'Fair':'Poor'}</div></div><div class="${card} lg:col-span-3 grid grid-cols-2 md:grid-cols-3 gap-3 text-sm">${[['Temperature',r.t+'°C'],['Humidity',r.h+'%'],['Status',bd(r.st)],['Anomaly',r.an?bd('High').replace('High',r.ty):bd('Normal')],['Failure probability',Math.round(r.p*100)+'%'],['Downtime risk',bd(r.rk)],['Remaining useful life',r.rul==null?'Not available':r.rul+' days <span class="text-xs text-slate-400">(demo)</span>'],['Maintenance required',yn(r.mt)]].map(([a,b])=>`<div><div class="text-xs text-slate-500">${a}</div><div class="font-semibold">${b}</div></div>`).join('')}</div></div>
<div class="grid lg:grid-cols-2 gap-3 mt-3">${sec('Temperature over time (48h)',cv('d1'))}${sec('Humidity over time (48h)',cv('d2'))}${sec('Combined temperature / humidity',cv('d3'))}${sec('Prediction history (failure probability %)',cv('d4'))}</div>`,
d(){const l=lab(d),o={scales:{x:{ticks:{maxTicksLimit:6}}}};ch('d1','line',{labels:l,datasets:[{data:d.map(x=>x.t),borderColor:'#14b8a6',pointRadius:0}]},o);ch('d2','line',{labels:l,datasets:[{data:d.map(x=>x.h),borderColor:'#3b82f6',pointRadius:0}]},o);
